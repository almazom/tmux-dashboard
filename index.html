<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDD Flow Documentation v3.1</title>
    <style>
        * { box-sizing: border-box; }
        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            color: #24292f;
            background: #ffffff;
        }
        h1 { 
            color: #1a73e8; 
            border-bottom: 3px solid #1a73e8; 
            padding-bottom: 15px;
            font-size: 2.2em;
        }
        h2 { 
            color: #2c3e50; 
            border-bottom: 1px solid #e1e4e8; 
            padding-bottom: 10px;
            margin-top: 40px;
            font-size: 1.6em;
        }
        h3 { 
            color: #34495e; 
            margin-top: 30px;
            font-size: 1.3em;
        }
        pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #e1e4e8;
        }
        code {
            background: #f6f8fa;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.9em;
        }
        pre code {
            background: none;
            padding: 0;
        }
        a { color: #0969da; text-decoration: none; }
        a:hover { text-decoration: underline; }
        blockquote {
            border-left: 4px solid #1a73e8;
            margin: 0;
            padding: 10px 20px;
            background: #f6f8fa;
            border-radius: 0 8px 8px 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #d0d7de;
            padding: 12px;
            text-align: left;
        }
        th { 
            background: #f6f8fa; 
            font-weight: 600;
        }
        tr:nth-child(even) { background: #f9f9f9; }
        ul, ol { padding-left: 30px; }
        li { margin: 8px 0; }
        hr { border: none; border-top: 1px solid #e1e4e8; margin: 30px 0; }
        #content { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .header {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 1px solid #e1e4e8;
            margin-bottom: 30px;
        }
        .header h1 { border: none; margin: 0; }
        .last-updated {
            color: #656d76;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 SDD Flow Documentation</h1>
        <div class="last-updated">Version 3.1 | Published via GitHub Pages</div>
    </div>
    <div id="content"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('SDD_FLOW_ONEFILE_v3.1.md')
            .then(r => r.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<p style="color:red">Error loading content: ' + err + '</p>';
            });
    </script>
</body>
</html>
